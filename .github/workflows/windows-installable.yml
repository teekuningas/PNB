name: Build and Package for Windows

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-windows-installable:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make mingw-w64-ucrt-x86_64-glew mingw-w64-ucrt-x86_64-glfw mingw-w64-ucrt-x86_64-mxml zip

      - name: Build project
        run: |
          mingw32-make -f Makefile.release.win

      - name: Package release archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p PNB
          cp ./PNB.exe PNB/
          cp ./LICENSE PNB/
          cp -r ./data PNB/
          ldd ./PNB.exe | awk -v prefix="${MSYSTEM_PREFIX}/bin/" 'index($3, prefix) == 1 {print $3}' | xargs -r cp -t PNB/
          ls -la PNB/
          zip -r "PNB-${TAG}.zip" PNB

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $args = @("release", "create", $tag, "PNB-$tag.zip", "--title", "Release $tag", "--generate-notes")
          if ($tag -match '[a-zA-Z]') {
            $args += "--prerelease"
          }
          gh @args
